name: Bridge data (NBI)
on:
  push:
    branches: [bridge-data]
    paths: [tools/nbi_extract.py, .github/workflows/bridge-data.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract Michigan bridge hazards
        run: python3 tools/nbi_extract.py
      - name: Commit results to branch
        run: |
          git config user.name "pablo-bot"
          git config user.email "pablo-bot@users.noreply.github.com"
          git add data/bridges
          git commit -m "data: Michigan NBI bridge hazards" || echo "nothing to commit"
          git push
