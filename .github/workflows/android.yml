name: Build Pablo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Release signing
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          {
            echo "storeFile=../keys/pablo.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=pablo"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=MAPS_API_KEY=${MAPS_API_KEY}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "pablo-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-apk
          path: pablo-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pablo build ${{ github.run_number }}
          prerelease: true
          files: pablo-*.apk
          body: |
            Install on Android: download the .apk below, open it, allow installs from this source.
            Signed: ${{ env.HAS_SIGNING_KEY == 'true' && 'release key' || 'DEBUG key (set KEYSTORE_PASSWORD secret)' }}
            Commit: ${{ github.sha }}
