name: Build Pablo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Release signing
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_ABS="$(pwd)/android/keys/pablo.jks"
          # Tolerate stray spaces/newlines from pasting into the secrets UI.
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          if ! keytool -list -keystore "$KEYSTORE_ABS" -storepass "$KEYSTORE_PASSWORD" -alias pablo >/dev/null 2>&1; then
            FP=$(printf '%s' "$KEYSTORE_PASSWORD" | sha256sum | cut -c1-16)
            case "$FP" in
              550e23324291858d) WHICH="secret IS the correct password, so the keystore itself is unreadable on this JDK" ;;
              a6b6175130b58123) WHICH="secret is still the OLD wrong password; the edit did not save" ;;
              *) WHICH="secret matches neither known password (typo?)" ;;
            esac
            echo "::error title=Signing::KEYSTORE_PASSWORD does not open the keystore: $WHICH. JDK: $(java -version 2>&1 | head -1)"
            exit 1
          fi
          {
            echo "storeFile=$KEYSTORE_ABS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=pablo"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "Release signing configured; keystore password verified."

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -o pipefail
          if ! flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=MAPS_API_KEY=${MAPS_API_KEY} 2>&1 | tee build.log; then
            # Surface the failure as an annotation so it is readable via the API.
            MSG=$(grep -E -A 12 "What went wrong|Error:|error:|FAILURE" build.log | head -60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build APK failed::${MSG:-no matching error lines; see full log}"
            exit 1
          fi

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "pablo-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-apk
          path: pablo-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pablo build ${{ github.run_number }}
          prerelease: true
          files: pablo-*.apk
          body: |
            Install on Android: download the .apk below, open it, allow installs from this source.
            Signed: ${{ env.HAS_SIGNING_KEY == 'true' && 'release key' || 'DEBUG key (set KEYSTORE_PASSWORD secret)' }}
            Commit: ${{ github.sha }}
